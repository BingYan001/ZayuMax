<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>杂鱼Max · logo 本体磨砂玻璃</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    min-height: 100vh;
    background: url("images/pool-bg.jpg") center / cover no-repeat fixed;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    padding: 40px 24px 96px;
  }

  h1 {
    text-align: center; color: #fff; font-size: 26px; letter-spacing: 2px;
    text-shadow: 0 2px 14px rgba(10, 55, 115, .6); margin-bottom: 6px;
  }
  .sub {
    text-align: center; color: rgba(255,255,255,.95); font-size: 13.5px;
    text-shadow: 0 1px 8px rgba(10,55,115,.6); margin-bottom: 40px;
  }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, 190px);
    gap: 40px 30px; justify-content: center; max-width: 1080px; margin: 0 auto;
  }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 12px; }

  /* ============ 核心：logo 本体 = 一块磨砂玻璃 ============ */
  .logo {
    width: 150px; height: 150px; position: relative; transition: transform .4s cubic-bezier(.2,.9,.3,1.35);
  }
  .logo:hover { transform: scale(1.08) rotate(-2deg); }

  /* 每一层都以 logo 形状(alpha)为遮罩 —— 形状外 100% 透明 */
  .logo > i {
    position: absolute; inset: 0; display: block;
    -webkit-mask-image: var(--s); mask-image: var(--s);
    -webkit-mask-size: contain; mask-size: contain;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: center; mask-position: center;
  }

  /* 1) 磨砂本体：烘焙式 —— 把页面背景复制一份（fixed 对齐视口），对内层做高斯模糊。
        backdrop-filter 与 mask 同用在 Chromium 有渲染 bug，故不直接用。 */
  .frost { overflow: hidden; }
  .frost > b {
    position: absolute; inset: -60px; display: block;
    background: url("images/pool-bg.jpg") center / cover no-repeat fixed;
    filter: blur(16px) saturate(185%) brightness(1.24) contrast(1.06);
  }

  /* 2) 磨砂颗粒：让"砂"感可见 */
  .grain {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.55'/></svg>");
    opacity: .30;
    mix-blend-mode: overlay;
  }

  /* 3) 立体玻璃：左上高光 + 右下冷调 */
  .gloss {
    background:
      linear-gradient(148deg,
        rgba(255,255,255,.78) 0%,
        rgba(255,255,255,.30) 26%,
        rgba(255,255,255,.00) 46%,
        rgba(255,255,255,.00) 62%,
        rgba(140,200,255,.26) 100%);
  }

  /* 4) 菲涅尔白边 + 厚度内阴影 */
  .rim {
    box-shadow:
      inset 0 0 0 2.5px rgba(255,255,255,.92),
      inset 0 -10px 16px rgba(28,80,155,.34),
      inset 0 9px 14px rgba(255,255,255,.42);
    filter: blur(.2px);
  }

  /* 5) 外投影：玻璃悬在背景上方 */
  .logo::after {
    content: ""; position: absolute; inset: 0;
    -webkit-mask-image: var(--s); mask-image: var(--s);
    -webkit-mask-size: contain; mask-size: contain;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: center; mask-position: center;
    background: rgba(10, 50, 110, .45);
    filter: blur(10px);
    transform: translate(4px, 10px);
    z-index: -1;
  }

  .name { color: #fff; font-size: 14px; font-weight: 600; text-shadow: 0 1px 8px rgba(10,55,115,.6); }

  .ctrl {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 16px;
    background: rgba(255,255,255,.2);
    backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid rgba(255,255,255,.5); border-radius: 999px;
    padding: 10px 24px; color: #fff; font-size: 13px;
    box-shadow: 0 10px 30px rgba(10,50,110,.28);
    white-space: nowrap;
  }
  .ctrl label { display: flex; align-items: center; gap: 8px; }
  .ctrl input[type=range] { width: 130px; accent-color: #fff; }
</style>
</head>
<body>

<h1>杂鱼Max · logo 本体磨砂玻璃</h1>
<div class="sub">只有图标图形本身是玻璃 —— 透明处直通背景，玻璃处是被磨砂的泳池</div>
<div class="sub" style="font-size:12px;opacity:.82;margin-top:-30px;margin-bottom:34px">
  APK 里用的是真 backdrop：模糊 = 图标边长 × 0.11（44dp 图标 ≈ 4.8dp），亮边 1.2dp，投影 6dp —— 与本页默认值一致
</div>

<div class="grid" id="grid"></div>

<div class="ctrl">
  <label>模糊 <input type="range" id="rBlur" min="0" max="48" value="16"><span id="vBlur">16px</span></label>
  <label>砂感 <input type="range" id="rGrain" min="0" max="100" value="30"><span id="vGrain">30%</span></label>
</div>

<script>
  const icons = [
    ["logo_123",    "123 网盘"],
    ["logo_xunlei", "迅雷"],
    ["logo_baidu",  "百度网盘"],
    ["logo_quark",  "夸克"],
    ["logo_uc",     "UC 网盘"],
    ["logo_139",    "139 邮箱"],
    ["logo_115",    "115 网盘"],
    ["logo_github", "GitHub"],
    ["logo_guangya", "光鸭云盘"],
    ["logo_ilanzou", "蓝奏云优享版"],
    ["logo_lanzou", "蓝奏云"],
  ];

  const grid = document.getElementById("grid");
  for (const [f, n] of icons) {
    const s = `url('glass-shapes/${f}.png')`;
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.innerHTML = `
      <div class="logo" style="--s:${s}">
        <i class="frost"><b></b></i>
        <i class="grain"></i>
        <i class="gloss"></i>
        <i class="rim"></i>
      </div>
      <div class="name">${n}</div>`;
    grid.appendChild(cell);
  }

  const rB = document.getElementById("rBlur"), vB = document.getElementById("vBlur");
  const rG = document.getElementById("rGrain"), vG = document.getElementById("vGrain");

  rB.addEventListener("input", () => {
    vB.textContent = rB.value + "px";
    document.querySelectorAll(".frost > b").forEach(e => {
      e.style.filter = `blur(${rB.value}px) saturate(185%) brightness(1.24) contrast(1.06)`;
    });
  });
  rG.addEventListener("input", () => {
    vG.textContent = rG.value + "%";
    document.querySelectorAll(".grain").forEach(e => e.style.opacity = rG.value / 100 * 0.85);
  });
</script>
</body>
</html>
