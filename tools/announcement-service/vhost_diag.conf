# 杂鱼Max 公告站（zayu-ann）—— 诊断版：区分 admin.php 与 api.php 的处理路径
server {
    listen 80;
    listen [::]:80;
    server_name zayu.pw;

    root /www/wwwroot/zayu-ann;
    index admin.php;

    access_log /www/wwwlogs/ann.zayu.log;
    error_log  /www/wwwlogs/ann.zayu.error.log;

    # admin：精确 location
    location = /admin.php {
        fastcgi_pass unix:/tmp/php-cgi-74.sock;
        include /etc/nginx/fastcgi.conf;
    }

    # api：精确 location（不带 PATH_INFO 时的兜底）
    location = /api.php {
        fastcgi_pass unix:/tmp/php-cgi-74.sock;
        include /etc/nginx/fastcgi.conf;
    }

    # API：/api/v1/xxx -> /api.php/api/v1/xxx
    location ^~ /api/ {
        rewrite ^/api/(.*)$ /api.php/$1 last;
    }

    # api.php + PATH_INFO
    location /api.php/ {
        fastcgi_pass unix:/tmp/php-cgi-74.sock;
        include /etc/nginx/fastcgi.conf;
    }

    location / { return 404; }
}
