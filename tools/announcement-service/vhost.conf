# 杂鱼Max 公告站（zayu-ann）
# 域名：zayu.pw（A 记录直连本机 107.151.245.232，不走 CDN）
# 只放行 3 个入口，其余全部 404。
# 关键经验（本机踩过）：
#  1. 正则 location + try_files 会把 api.php 的 PATH_INFO 判成 404 → "Primary script unknown"
#  2. 用精确/前缀 location（= 与 /prefix/）最稳；PHP 侧读 PATH_INFO 剥前缀
#  3. acme.sh 的 http-01 校验走 /.well-known/acme-challenge/，
#     必须在该 server 块里显式放行，否则被末尾的 "location / { return 404; }" 打死
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zayu.pw;

    root /www/wwwroot/zayu-ann;
    index admin.php;

    access_log /www/wwwlogs/zayu.pw.log;
    error_log  /www/wwwlogs/zayu.pw.error.log;

    client_max_body_size 12m;

    ssl_certificate     /www/server/panel/vhost/cert/zayu.pw/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/zayu.pw/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:ZayuSSL:10m;
    ssl_session_timeout 1d;

    # Let's Encrypt 续期校验（必须放在 404 兜底之前）
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/zayu-ann;
    }

    # 公告配图直链（管理端上传后由客户端 <img> 直接加载）
    # 安全要点：上传目录**绝不能执行 PHP**，否则一旦被塞进 x.php 就是 RCE。
    #   实测坑：光写 try_files $uri =404; 时，.php 仍返回 200（命中真实文件后被 PHP handler 接管）。
    #   也不能在 ^~ /uploads/ 块里直接 return 404（会连带把合法图片一起 404）。
    # 做法：用正则把「不以图片扩展名结尾」的请求一律打死，只让图片通过。
    location ^~ /uploads/ {
        root /www/wwwroot/zayu-ann;

        # 非图片扩展名 → 404（含 .php / .phtml / .htaccess 等一切非白名单）
        location ~* ^/uploads/.+\.(?!jpe?g$|png$|gif$|webp$) {
            return 404;
        }
        # 无扩展名也算可疑（例如 /uploads/shell）
        location ~* ^/uploads/[^.]+$ {
            return 404;
        }

        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff;
    }

    # 后台管理页
    location = /admin.php {
        fastcgi_pass unix:/tmp/php-cgi-74.sock;
        include /etc/nginx/fastcgi.conf;
        fastcgi_read_timeout 30s;
    }

    # API：/api/v1/xxx -> /api.php/api/v1/xxx
    location ^~ /api/ {
        rewrite ^/api/(.*)$ /api.php/$1 last;
    }

    location /api.php/ {
        fastcgi_pass unix:/tmp/php-cgi-74.sock;
        include /etc/nginx/fastcgi.conf;
        fastcgi_read_timeout 30s;
    }

    # APK 更新包直链（强更弹窗「立即更新」走这里，浏览器直接下载）
    # 安全口径与 /uploads/ 相同：只放行 .apk，其余（含 .php）一律 404，不给任何执行面。
    location ^~ /downloads/ {
        root /www/wwwroot/zayu-ann;

        location ~* ^/downloads/.+\.(?!apk$) {
            return 404;
        }
        location ~* ^/downloads/[^.]+$ {
            return 404;
        }

        try_files $uri =404;
        add_header X-Content-Type-Options nosniff;
    }

    location / { return 404; }
}
