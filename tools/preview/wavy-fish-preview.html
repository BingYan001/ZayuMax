<body>
<h1>波浪鱼跃进度条 · 真实物理预览</h1>
<div class="tip">鱼 = 多段贝塞尔身体 + 脊椎摆动，抛体受重力，姿态跟随速度矢量，入水有「钻入」压角与水花。下方紫色分片杠按既有逻辑间歇出现。</div>

<div class="ctrl">
  <button id="jumpNow">立即跳一条鱼</button>
  <label>重力 <input type="range" id="g" min="400" max="2200" value="1150"> <span id="gv"></span></label>
  <label>跃距 <input type="range" id="dist" min="20" max="120" value="55"> <span id="dv"></span></label>
  <label>间隔 <input type="range" id="interval" min="1200" max="8000" value="3800"> <span id="iv"></span></label>
  <button id="pause">暂停/继续下载</button>
</div>

<div class="card">
  <div class="row1"><div class="fname">《聪明人的做事风格系列》[3册].zip</div><div style="font-size:20px;color:#1d4e77;">❚❚</div></div>
  <div class="stat" id="stat">526.6 KB/s · 剩余 32 秒 · 32 线程</div>
  <canvas id="cv"></canvas>
  <div class="foot"><span id="pct">已下载 22.6 MB / 39.3 MB · 57%</span><span class="del">🗑 删除</span></div>
</div>

<div class="legend">对比要点：① 起跳离水瞬间身体拉伸、尾根发力摆动 ② 空中抛体（v-t 二次曲线）+ 朝向 = 速度方向，不是匀速滑弧 ③ 入水「钻入」：头朝下压角穿入，水面破口水花向两侧翻卷 ④ 落水涟漪双环扩散 ⑤ 入水后鱼消失（不做水下巡游）。</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W=0,H=0, DPR = window.devicePixelRatio||1;
function resize(){
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize); resize();

// ---- 参数（滑杆可控） ----
let GRAV = 1150, JUMP_DX = 55, INTERVAL = 3800;
document.getElementById('g').oninput = e=>{ GRAV=+e.target.value; document.getElementById('gv').textContent=GRAV; };
document.getElementById('dist').oninput = e=>{ JUMP_DX=+e.target.value; document.getElementById('dv').textContent=JUMP_DX+'px'; };
document.getElementById('interval').oninput = e=>{ INTERVAL=+e.target.value; document.getElementById('iv').textContent=(INTERVAL/1000)+'s'; };
document.getElementById('gv').textContent=GRAV; document.getElementById('dv').textContent=JUMP_DX+'px'; document.getElementById('iv').textContent=(INTERVAL/1000)+'s';

let waving = true;
document.getElementById('pause').onclick = ()=>{ waving=!waving;
  document.getElementById('stat').textContent = waving? '526.6 KB/s · 剩余 32 秒 · 32 线程' : '已暂停 · 0 KB/s';
};

// ---- 状态 ----
let progress = 0.57;
let phase = 0;            // 波浪相位
let clock = 0;
let nextJumpIn = 0.8;
let fish = null;          // {x0,y0,t,vx,vy,len}
let splashes = [];        // {x,y,vx,vy,r,life,age}
let bubbles = [];         // {x,y,vy,r,life,age} 水下气泡
let ripples = [];         // {x,y,age,life,maxR}
let chunkAnim = 0;        // 分片杠动画

const AMP=5, STROKE=2.8, LAMBDA=110;
const surfY = ()=> H - AMP - STROKE - 14; // 波浪线基准（留出下部分片杠空间）

let ampBoost = 1; // 鱼入水脉冲：短暂 >1 后指数回落
function waveY(x){
  return surfY() + (
    Math.sin((x/LAMBDA)*Math.PI*2 - phase)*AMP
    + Math.sin((x/(LAMBDA*0.53))*Math.PI*2 + phase*1.7)*AMP*0.32 // 次频：不同波长+不同速
  ) * ampBoost;
}

function drawFish(f){
  const ang=Math.atan2(f.vy,f.vx);
  const wig = Math.sin(clock*16)*0.10;
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.rotate(ang + wig);
  ctx.scale((f.vx>=0? 1:-1), 1); // 贴图头朝右
  const w2 = f.len*1.55, h2 = w2*245/394;
  ctx.shadowColor='rgba(20,60,110,.30)';
  ctx.shadowBlur=4; ctx.shadowOffsetY=2;
  if(FISH_IMG.complete && FISH_IMG.naturalWidth>0)
    ctx.drawImage(FISH_IMG, -w2/2, -h2/2, w2, h2);
  ctx.restore();
}

// ---- 水花 ----
function spawnSplash(x,y,n,power){
  for(let i=0;i<n;i++){
    const a = -Math.PI/2 + (Math.random()*1.4-0.7);
    const sp = (90+Math.random()*160)*power;
    splashes.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:1+Math.random()*1.8,life:.45+Math.random()*.4,age:0});
  }
  ripples.push({x,y,age:0,life:.8,maxR:20*power});
}
function spawnSplashSided(x,y,power){ power=power*1.4;
  // 入水：水花向两侧翻卷（低角度对称抛）
  for(let i=0;i<14;i++){
    const dir = Math.random()<.5?-1:1;
    const a = -Math.PI/2 + dir*(0.5+Math.random()*0.9);
    const sp = (70+Math.random()*150)*power;
    splashes.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:0.8+Math.random()*1.6,life:.4+Math.random()*.35,age:0});
  }
  ripples.push({x,y,age:0,life:.9,maxR:26*power});
  ripples.push({x,y,age:-0.12,life:.9,maxR:26*power}); // 双环
}

// ---- 主循环 ----
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05,(now-last)/1000); last=now;
  clock += dt;
  if(waving){
    phase += dt*13;
    progress = Math.min(0.995, progress + dt*0.006);
    nextJumpIn -= dt;
    if(nextJumpIn<=0 && !fish && progress>0.02 && progress<0.99){
      // 跳对点：起跳点在水头稍后方随机偏移（保留随机感），落水点 = 飞行 0.48s 内水头前进到的位置
      const T = 0.48;
      const landFrac = Math.min(0.99, progress + 0.006*T);
      const x0 = W*Math.max(0.02, progress - (0.02 + Math.random()*0.04));
      fish = {x0, y0:waveY(x0), x:x0, y:waveY(x0), t:0, vx:(W*landFrac - x0)/T, vy:-GRAV*0.24, len:24};
      spawnSplash(x0, waveY(x0), 6, 0.55);
      nextJumpIn = INTERVAL/1000*(0.7+Math.random()*0.6);
    }
  }
  // 鱼抛体
  if(fish){
    fish.t += dt;
    fish.vy += GRAV*dt;
    fish.x += fish.vx*dt;
    fish.y += fish.vy*dt;
    if(fish.vy>0 && fish.y >= waveY(fish.x)){ // 入水（下落穿越水面）
      spawnSplashSided(fish.x, waveY(fish.x), 1);
      ampBoost = 3.2; // 水体整体抖一下
      for(let i=0;i<9;i++){
        bubbles.push({x:fish.x+(Math.random()*14-7), y:waveY(fish.x)+4+Math.random()*6,
                      vy:-(26+Math.random()*30), r:1.6+Math.random()*2.2, life:.7+Math.random()*.6, age:0});
      }
      fish = null;
    } else if (fish.t>2){ fish=null; }
  }
  // 粒子
  splashes.forEach(p=>{ p.age+=dt; p.vy+=620*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; });
  splashes = splashes.filter(p=>p.age<p.life);
  bubbles.forEach(b=>{ b.age+=dt; b.y+=b.vy*dt; b.x+=Math.sin(clock*6+b.r*9)*8*dt; });
  bubbles = bubbles.filter(b=>b.age<b.life && b.y<waveY(b.x));
  ampBoost += (1-ampBoost)*dt*2.2;
  ripples.forEach(r=>r.age+=dt);
  ripples = ripples.filter(r=>r.age<r.life);

  // ============ 绘制 ============
  ctx.clearRect(0,0,W,H);
  const cy = surfY();
  // 波浪线路径
  const wavePath = new Path2D();
  for(let x=0;x<=W+4;x+=4){
    const y = waveY(x);
    x===0? wavePath.moveTo(x,y) : wavePath.lineTo(x,y);
  }
  const fillW = W*progress;
  // 轨道段
  ctx.save(); ctx.beginPath(); ctx.rect(fillW,0,W-fillW,H); ctx.clip();
  ctx.strokeStyle='rgba(255,255,255,.75)'; ctx.lineWidth=STROKE; ctx.lineCap='round';
  ctx.stroke(wavePath); ctx.restore();
  // 填充段：蓝渐变描边
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,fillW,H); ctx.clip();
  const grad = ctx.createLinearGradient(0,0,W,0);
  grad.addColorStop(0,'#6FD6FF'); grad.addColorStop(1,'#2E7CF6');
  ctx.strokeStyle=grad; ctx.lineWidth=STROKE; ctx.lineCap='round';
  ctx.stroke(wavePath); ctx.restore();
  // 水体：波浪顶面 + 平底（仅已下载段；波浪线以下填半透明蓝，底边平直）
  const bottomY = surfY() + 14;
  const waterPath = new Path2D(wavePath);
  waterPath.lineTo(W, bottomY); waterPath.lineTo(0, bottomY); waterPath.closePath();
  const wgrad = ctx.createLinearGradient(0, surfY()-AMP, 0, bottomY);
  wgrad.addColorStop(0,'rgba(46,124,246,.50)');
  wgrad.addColorStop(0.55,'rgba(80,170,250,.30)');
  wgrad.addColorStop(1,'rgba(111,214,255,.14)');
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,fillW,H); ctx.clip();
  ctx.fillStyle = wgrad;
  ctx.fill(waterPath);
  ctx.restore();
  // 水面高光：紧贴波浪线上方一条半透明白细线
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,fillW,H); ctx.clip();
  ctx.strokeStyle='rgba(255,255,255,.65)'; ctx.lineWidth=1.5;
  const hlPath=new Path2D();
  for(let x=0;x<=W+4;x+=4){
    const y=waveY(x)-STROKE*0.9;
    x===0? hlPath.moveTo(x,y) : hlPath.lineTo(x,y);
  }
  ctx.stroke(hlPath); ctx.restore();
  // 水头点
  if(progress<0.995){
    ctx.fillStyle='#2E7CF6';
    ctx.beginPath(); ctx.arc(fillW, waveY(fillW), STROKE*0.9, 0, Math.PI*2); ctx.fill();
  }
  // 鱼拖尾残影
  if(fish){
    fish.trail = (fish.trail||[]).concat([{x:fish.x,y:fish.y}]).slice(-5);
    fish.trail.forEach((t,i)=>{
      const a=(i+1)/6*0.38;
      ctx.fillStyle=`rgba(247,242,221,${a})`;
      ctx.beginPath(); ctx.ellipse(t.x,t.y,9,5,Math.atan2(fish.vy,fish.vx),0,Math.PI*2); ctx.fill();
    });
  }
  // 鱼
  if(fish) drawFish(fish);
  // 涟漪（双环）
  ripples.forEach(r=>{
    if(r.age<0) return;
    const p=r.age/r.life;
    ctx.strokeStyle=`rgba(255,255,255,${(1-p)*0.6})`;
    ctx.lineWidth=Math.max(1,2.4*(1-p));
    ctx.beginPath(); ctx.ellipse(r.x,r.y,r.maxR*p,r.maxR*p*0.32,0,0,Math.PI*2); ctx.stroke();
  });
  // 水下气泡（半透明白圈，上浮中）
  bubbles.forEach(b=>{
    const a=(1-b.age/b.life)*0.5;
    ctx.strokeStyle=`rgba(255,255,255,${a})`;
    ctx.lineWidth=0.9;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.stroke();
  });
  // 水珠
  splashes.forEach(p=>{
    const a=1-p.age/p.life;
    ctx.fillStyle=`rgba(255,255,255,${a*0.9})`;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  });

  // 分片杠：默认隐藏（用户已要求隐藏；需要时把 HIDE_CHUNKS 改 false）
  const HIDE_CHUNKS = true;
  chunkAnim += dt;
  const showChunks = !HIDE_CHUNKS && waving && (Math.sin(chunkAnim*0.25)>-0.2);
  if(showChunks){
    const n=26, bw=5, gap=2.5, bx=8, by=surfY()+12;
    for(let i=0;i<n;i++){
      const on = ((i + Math.floor(clock*18)) % 7) !== 0;
      ctx.fillStyle = on? 'rgba(93,63,211,.85)' : 'rgba(93,63,211,.25)';
      ctx.fillRect(bx+i*(bw+gap), by, bw, 7+Math.abs(Math.sin(clock*3+i*0.6))*3);
    }
  }

  // 文本
  document.getElementById('pct').textContent = `已下载 ${(39.3*progress).toFixed(1)} MB / 39.3 MB · ${Math.round(progress*100)}%`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.getElementById('jumpNow').onclick = ()=>{
  if(!fish && progress>0.02){
    const T = 0.48;
    const landFrac = Math.min(0.99, progress + 0.006*T);
    const x0 = W*Math.max(0.02, progress - (0.02 + Math.random()*0.04));
    fish = {x0, y0:waveY(x0), x:x0, y:waveY(x0), t:0, vx:(W*landFrac - x0)/T, vy:-GRAV*0.24, len:24};
    spawnSplash(x0, waveY(x0), 6, 0.55);
  }
};
</script>
